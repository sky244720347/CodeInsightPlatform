spring:
  profiles:
    active: local
  main:
    banner-mode: "off"

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

# ??????? profile ??? application-{profile}.yml ???
code-insight:
  env: ${CODE_INSIGHT_ENV:dev}
  cluster:
    # enabled ????? ClusterEnvAligner ? env ???dev=false?? dev=true?
    leader-lock-ttl-seconds: 15
    task-lease-hours: 2
    draft-edit-lock-ttl-seconds: 120
    draft-edit-lock-renew-seconds: 60
    # ???? Redis ???TTL + ??????????/?? DB ????
    task-permit-ttl-seconds: 300
    task-permit-renew-seconds: 60
    # ???? TTL???? task-permit-reconcile??????????
    instance-heartbeat-ttl-seconds: 180
    task-permit-reconcile-interval-ms: 30000
    # ?? DB ??????+ ???????????? ? ??????? orphan-reclaim-lease-heartbeat-design.md?
    task-lease-minutes: 30
    task-lease-grace-minutes: 10
    task-lease-renew-interval-ms: 120000
    orphan-reclaim-interval-ms: 30000
  storage:
    # ? dev ???????dev ?? ./storage ??? ./storage/workspaces?./storage/releases???????
    runtime-root: ${STORAGE_RUNTIME_ROOT:}
    releases-root: ${STORAGE_RELEASES_ROOT:}

  publish:
    release-keep-count: ${PUBLISH_RELEASE_KEEP_COUNT:3}
    release-prune-max-attempts: ${PUBLISH_RELEASE_PRUNE_MAX_ATTEMPTS:3}
    release-prune-backoff-ms: ${PUBLISH_RELEASE_PRUNE_BACKOFF_MS:2000}
    release-prune-reconcile-enabled: ${PUBLISH_RELEASE_PRUNE_RECONCILE_ENABLED:true}
    release-prune-reconcile-interval-ms: ${PUBLISH_RELEASE_PRUNE_RECONCILE_INTERVAL_MS:3600000}
  parser:
    # ??????????
    #   ast-fallback-regex?????? AST???????? REGEX
    #   ast                       ?? AST???????????
    #   regex                     ??????? MVP ???
    engine: ast-fallback-regex
  ai:
    hierarchy-parallelism: 4   # ???? AI ????????? API ????
    retry:
      # ??????????????????
      hierarchy-max-attempts: 3
      doc-max-attempts: 5
      backoff-ms: 1000           # ??????????????? = backoff-ms * attempt
      unlimited-attempts: false
      unlimited-backoff-cap-ms: 60000
      # ???????? AiSummaryServiceImpl.acquireAiPermitWithWait??????????
      concurrency-backoff-ms: 2000
    doc:
      # ?? A??????????? docs/doc-generation-guarantee-plan.md ?4
      max-prompt-chars: 100000
      max-method-body-chars: 12000
      http-timeout-seconds: 120
      shrink-factor: 0.5
      # ???????????????????????????
      parallelism: 4
      # ??? MODULE_HIERARCHY ? AI ?????????? ? http-timeout?????????????
      acquire-wait-seconds: 1800
      # ????????????? 5s??????
      acquire-poll-interval-ms: 5000
      # true?????????????????????? PipelineAiCaller ???? attempt
      acquire-wait-unlimited: false
  review:
    # true??????????????????????????????? CONFIRMED?
    allow-partial-pass: ${REVIEW_ALLOW_PARTIAL_PASS:false}
  schedule:
    enabled: true             # ???????????false ? ScheduleExecutor ?????
    poll-interval-ms: 60000    # ???????????????? schedule
    queue-poll-interval-ms: 30000  # ???????QUEUE ???
    lock-ttl-seconds: 30       # Redis ???? TTL

  scan:
    enabled: ${SCAN_ENABLED:true}
    cron: "${SCAN_CRON:0 */5 * * * *}"
    global-poll-enabled: ${SCAN_GLOBAL_POLL_ENABLED:true}
    force-full-on-unchanged: ${SCAN_FORCE_FULL_ON_UNCHANGED:true}
    daily-coverage-enabled: ${SCAN_DAILY_COVERAGE_ENABLED:true}
    poll-concurrency: ${SCAN_POLL_CONCURRENCY:2}
    poll-batch-size: ${SCAN_POLL_BATCH_SIZE:30}
    max-sweep-seconds: ${SCAN_MAX_SWEEP_SECONDS:300}
    probe-timeout-seconds: ${SCAN_PROBE_TIMEOUT_SECONDS:30}
    probe-max-attempts: ${SCAN_PROBE_MAX_ATTEMPTS:3}
    probe-retry-backoff-ms: ${SCAN_PROBE_RETRY_BACKOFF_MS:2000}
  task:
    queue-dispatch-interval-ms: 5000   # ????????????????TaskQueueDispatcher ??
    # ?????????????????????????? label?? Java ? Java,Python?????????????
    supported-tech-stacks: ${TASK_SUPPORTED_TECH_STACKS:Java}
  repo:
    # Git ??????????????Leader ????
    git-check-interval-ms: ${REPO_GIT_CHECK_INTERVAL_MS:180000}
    # ????????????? interval ????????????????????
    git-check-initial-delay-ms: ${REPO_GIT_CHECK_INITIAL_DELAY_MS:180000}
    # ?? ls-remote ?????
    git-check-timeout-seconds: ${REPO_GIT_CHECK_TIMEOUT_SECONDS:15}
    # ??/????????
    git-check-concurrency: ${REPO_GIT_CHECK_CONCURRENCY:3}
    git-check-batch-size: ${REPO_GIT_CHECK_BATCH_SIZE:40}
    git-check-max-sweep-seconds: ${REPO_GIT_CHECK_MAX_SWEEP_SECONDS:120}
    git-check-reachable-ttl-ms: ${REPO_GIT_CHECK_REACHABLE_TTL_MS:21600000}
    git-check-unreachable-ttl-ms: ${REPO_GIT_CHECK_UNREACHABLE_TTL_MS:1800000}
    # stack probe: Leader serial + COUNT schedule backoff + run-end NAS cleanup
    stack-probe-enabled: ${REPO_STACK_PROBE_ENABLED:true}
    stack-probe-interval-ms: ${REPO_STACK_PROBE_INTERVAL_MS:20000}
    stack-probe-initial-delay-ms: ${REPO_STACK_PROBE_INITIAL_DELAY_MS:30000}
    stack-probe-batch-size: ${REPO_STACK_PROBE_BATCH_SIZE:30}
    stack-probe-tree-timeout-ms: ${REPO_STACK_PROBE_TREE_TIMEOUT_MS:45000}
    stack-probe-max-sweep-seconds: ${REPO_STACK_PROBE_MAX_SWEEP_SECONDS:1800}
    # Leader TTL floor; renew once per batch; actual TTL >= batchSize*tree-timeout+120 (default 1800s)
    stack-probe-leader-lock-ttl-seconds: ${REPO_STACK_PROBE_LEADER_LOCK_TTL_SECONDS:1800}
    stack-probe-active-delay-ms: ${REPO_STACK_PROBE_ACTIVE_DELAY_MS:20000}
    stack-probe-idle-backoff-ms: "${REPO_STACK_PROBE_IDLE_BACKOFF_MS:60000,300000,900000}"
    stack-probe-on-create: ${REPO_STACK_PROBE_ON_CREATE:true}
    stack-probe-orphan-max-age-hours: ${REPO_STACK_PROBE_ORPHAN_MAX_AGE_HOURS:2}

