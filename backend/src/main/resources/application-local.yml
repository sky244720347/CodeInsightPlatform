server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:47.97.114.189}:${DB_PORT:5432}/${DB_NAME:code_insight}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  sql:
    init:
      # 生产环境默认不在启动时执行 schema；本地首次建库可设 SQL_INIT_MODE=always
      # 新库推荐 schema-fresh.sql；旧库升级继续用 schema.sql
      mode: ${SQL_INIT_MODE:never}
      schema-locations: ${SQL_SCHEMA_LOCATION:classpath:db/schema.sql}
  data:
    redis:
      host: ${REDIS_HOST:47.97.114.189}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:YourStrongPassword123}
      timeout: 3000ms
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

code-insight:
  env: ${CODE_INSIGHT_ENV:dev}
  ai:
    mock: ${LLM_MOCK:true}
    api-key: ${LLM_API_KEY:}
    api-url: ${LLM_API_URL:https://api.minimax.io/v1}
    model-name: ${LLM_MODEL_NAME:MiniMax-M3}
    hierarchy-parallelism: ${AI_HIERARCHY_PARALLELISM:4}
    retry:
      hierarchy-max-attempts: ${AI_RETRY_HIERARCHY_MAX_ATTEMPTS:3}
      doc-max-attempts: ${AI_RETRY_DOC_MAX_ATTEMPTS:5}
      backoff-ms: ${AI_RETRY_BACKOFF_MS:1000}
    doc:
      parallelism: ${AI_DOC_PARALLELISM:4}
      acquire-wait-seconds: ${AI_DOC_ACQUIRE_WAIT_SECONDS:1800}
      acquire-poll-interval-ms: ${AI_DOC_ACQUIRE_POLL_INTERVAL_MS:5000}
      http-timeout-seconds: ${AI_DOC_HTTP_TIMEOUT_SECONDS:120}
  token:
    limit-enabled: ${TOKEN_LIMIT_ENABLED:true}
    task-limit: ${TOKEN_TASK_LIMIT:100000}
    system-monthly-limit: ${TOKEN_SYSTEM_MONTHLY_LIMIT:1000000}
  storage:
    runtime-root: ${STORAGE_RUNTIME_ROOT:}
    releases-root: ${STORAGE_RELEASES_ROOT:}
  doc-generation:
    granularity: ${DOC_GENERATION_GRANULARITY:function}
  review:
    allow-partial-pass: ${REVIEW_ALLOW_PARTIAL_PASS:false}
  push:
    queue:
      enabled: ${PUSH_QUEUE_ENABLED:true}
    scheduler:
      poll-interval-ms: ${PUSH_SCHEDULER_INTERVAL:2000}
    git:
      commit-prefix: "${PUSH_GIT_COMMIT_PREFIX:docs: add code-insight knowledge}"
    default-method: ${PUSH_DEFAULT_METHOD:NAS}
    s3:
      enabled: ${PUSH_S3_ENABLED:false}
