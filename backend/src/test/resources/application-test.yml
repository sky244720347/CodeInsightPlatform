spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:code_insight_test}?stringtype=unspecified&sslmode=disable
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:47.97.114.189}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:YourStrongPassword123}
      timeout: 3000ms
      repositories:
        enabled: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 自定义配置
code-insight:
  env: dev
  ai:
    mock: true
  storage:
    runtime-root:
    releases-root: